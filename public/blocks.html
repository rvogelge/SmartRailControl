<!DOCTYPE html>
<html lang="en" data-title-key="title.blocks">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1117" />
    <title>SmartRailControl – Blocks</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="decoders-page">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M6 3h12a3 3 0 0 1 3 3v8a4 4 0 0 1-3.2 3.92l1.9 2.37a.75.75 0 1 1-1.17.94L16.06 18H7.94l-2.47 3.23a.75.75 0 1 1-1.18-.94l1.9-2.37A4 4 0 0 1 3 14V6a3 3 0 0 1 3-3Zm0 1.5A1.5 1.5 0 0 0 4.5 6v4h15V6A1.5 1.5 0 0 0 18 4.5H6Zm1.5 9a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm9 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Z"/></svg>
        </span>
        <span class="brand-name">SmartRailControl</span>
        <span class="page-title" data-i18n="blocks.title">Blocks</span>
      </div>

      <div class="topbar-actions">
        <div class="menu">
          <button type="button" id="menuButton" class="icon-button menu-button" aria-haspopup="menu" aria-expanded="false" aria-controls="mainMenu" aria-label="Menu" title="Menu" data-i18n-attr="aria-label:menu.title; title:menu.title">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M4 6.25A.75.75 0 0 1 4.75 5.5h14.5a.75.75 0 0 1 0 1.5H4.75A.75.75 0 0 1 4 6.25Zm0 5.75a.75.75 0 0 1 .75-.75h14.5a.75.75 0 0 1 0 1.5H4.75A.75.75 0 0 1 4 12Zm.75 5a.75.75 0 0 0 0 1.5h14.5a.75.75 0 0 0 0-1.5H4.75Z"/></svg>
          </button>
          <div id="mainMenu" class="menu-list" role="menu" aria-labelledby="menuButton" hidden>
            <a role="menuitem" href="/#settings" data-action="settings"><span class="menu-icon" aria-hidden="true">⚙</span><span data-i18n="menu.settings">Settings</span></a>
            <a role="menuitem" href="/#edit" data-action="edit"><span class="menu-icon" aria-hidden="true">✎</span><span data-i18n="menu.layout">Layout</span></a>
            <a role="menuitem" href="/#run" data-action="run"><span class="menu-icon" aria-hidden="true">▶</span><span data-i18n="menu.run">Run</span></a>
            <a role="menuitem" href="/locomotives.html" data-action="locos"><span class="menu-icon" aria-hidden="true">🚂</span><span data-i18n="menu.locos">Locomotives</span></a>
            <a role="menuitem" href="/blocks.html" data-action="blocks" aria-current="true"><span class="menu-icon" aria-hidden="true">▤</span><span data-i18n="menu.blocks">Blocks</span></a>
            <a role="menuitem" href="/decoders.html" data-action="decoders"><span class="menu-icon" aria-hidden="true">⇄</span><span data-i18n="menu.decoders">Decoder test</span></a>
          </div>
        </div>
      </div>
    </header>

    <main class="decoders-main blocks-main">
      <section class="card decoders-card" aria-labelledby="blocksHeading">
        <div class="card-header">
          <h2 id="blocksHeading" data-i18n="blocks.heading">Blocks</h2>
        </div>
        <p class="hint decoders-hint" data-i18n="blocks.hint">
          Blocks are found from the contact tracks marked as block start (Layout → edit mode). Each block keeps its number.
        </p>
        <div class="decoders-list" role="table" aria-labelledby="blocksHeading">
          <div class="block-row decoder-head" role="row">
            <span role="columnheader" data-i18n="blocks.number">No.</span>
            <span role="columnheader" data-i18n="blocks.start">Start contact</span>
            <span role="columnheader" data-i18n="blocks.tracks">Tracks</span>
            <span role="columnheader" data-i18n="blocks.leadsTo">Leads to</span>
            <span role="columnheader" data-i18n="blocks.status">Status</span>
          </div>
          <div id="blockRows" role="rowgroup"></div>
        </div>
        <p id="statusLine" class="response" aria-live="polite"></p>
      </section>

    </main>

    <script src="i18n.js"></script>
    <script src="blocks.js"></script>
    <script src="menu.js"></script>
  </body>
</html>
