<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BirdRail Controls</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="panel control-panel">
        <div class="header-row">
          <div>
            <p class="eyebrow">Raspberry Pi</p>
            <h1>BirdRail</h1>
          </div>
          <div id="status-chip" class="status-chip offline">offline</div>
        </div>

        <form id="locomotive-form" class="controller-form">
          <label>
            Decoder ID
            <input id="decoderId" name="decoderId" type="number" min="1" max="9999" value="3" required />
          </label>

          <fieldset class="direction-group">
            <legend>Direction</legend>
            <label><input type="radio" name="direction" value="forward" checked /> Forward</label>
            <label><input type="radio" name="direction" value="reverse" /> Reverse</label>
          </fieldset>

          <div class="slider-row">
            <label for="speed">Speed</label>
            <output id="speedValue" for="speed">0</output>
          </div>
          <input id="speed" name="speed" type="range" min="0" max="127" step="1" value="0" />

          <div class="action-row">
            <button type="button" id="stopButton" class="danger">Stop</button>
            <button type="submit" class="primary">Send command</button>
          </div>
        </form>

        <div id="responseBox" class="response-box" aria-live="polite">
          Ready.
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
