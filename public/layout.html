<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1117" />
    <title>BirdRail – Track layout</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M6 3h12a3 3 0 0 1 3 3v8a4 4 0 0 1-3.2 3.92l1.9 2.37a.75.75 0 1 1-1.17.94L16.06 18H7.94l-2.47 3.23a.75.75 0 1 1-1.18-.94l1.9-2.37A4 4 0 0 1 3 14V6a3 3 0 0 1 3-3Zm0 1.5A1.5 1.5 0 0 0 4.5 6v4h15V6A1.5 1.5 0 0 0 18 4.5H6Zm1.5 9a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm9 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Z"/></svg>
        </span>
        <span class="brand-name">BirdRail</span>
      </div>

      <nav class="tabs" aria-label="Pages">
        <a href="/">Control</a>
        <a href="/layout.html" aria-current="page">Layout</a>
      </nav>

      <div class="topbar-actions">
        <span id="saveState" class="save-state" aria-live="polite">Saved</span>
      </div>
    </header>

    <main class="layout-editor">
      <aside class="card palette-card" aria-label="Track elements">
        <div class="card-header">
          <h2>Elements</h2>
        </div>
        <ul id="palette" class="palette" role="listbox" aria-label="Select element"></ul>
        <p class="hint">
          Pick an element, then click a square to place it.<br />
          <kbd>R</kbd> rotate · <kbd>Del</kbd> remove · <kbd>Esc</kbd> select tool · <kbd>E</kbd> edit/run
        </p>
      </aside>

      <section class="card board-card" aria-label="Layout pane">
        <div class="toolbar">
          <div class="segmented mode-switch" role="radiogroup" aria-label="Mode">
            <button type="button" class="segment" data-mode="edit" role="radio" aria-checked="true" title="Edit layout (E)">✎ Edit</button>
            <button type="button" class="segment" data-mode="run" role="radio" aria-checked="false" title="Run mode (E)">▶ Run</button>
          </div>
          <div class="toolbar-group edit-only">
            <button type="button" id="rotateButton" class="ghost small" title="Rotate (R)">⟳ Rotate</button>
            <button type="button" id="deleteButton" class="ghost small danger-text" title="Remove (Del)">Remove</button>
          </div>
          <div class="toolbar-group edit-only">
            <label class="grid-size">
              <span>Cols</span>
              <input id="colsInput" type="number" min="4" max="60" />
            </label>
            <label class="grid-size">
              <span>Rows</span>
              <input id="rowsInput" type="number" min="4" max="40" />
            </label>
            <button type="button" id="clearButton" class="ghost small danger-text">Clear all</button>
          </div>
        </div>

        <div class="board-scroll">
          <svg id="board" class="board" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Track layout grid">
            <defs>
              <pattern id="gridPattern" width="100" height="100" patternUnits="userSpaceOnUse">
                <rect width="100" height="100" fill="none" stroke="var(--grid-line)" stroke-width="2" />
              </pattern>
            </defs>
            <rect id="gridRect" x="0" y="0" fill="url(#gridPattern)" />
            <g id="tilesLayer"></g>
            <g id="overlayLayer" pointer-events="none"></g>
          </svg>
        </div>

        <p id="statusLine" class="response" aria-live="polite">Ready.</p>
      </section>
    </main>

    <script src="layout.js"></script>
  </body>
</html>
