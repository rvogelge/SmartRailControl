<!DOCTYPE html>
<html lang="en" data-title-key="title.locos">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1117" />
    <title>SmartRailControl – Locomotives</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="decoders-page">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M6 3h12a3 3 0 0 1 3 3v8a4 4 0 0 1-3.2 3.92l1.9 2.37a.75.75 0 1 1-1.17.94L16.06 18H7.94l-2.47 3.23a.75.75 0 1 1-1.18-.94l1.9-2.37A4 4 0 0 1 3 14V6a3 3 0 0 1 3-3Zm0 1.5A1.5 1.5 0 0 0 4.5 6v4h15V6A1.5 1.5 0 0 0 18 4.5H6Zm1.5 9a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm9 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Z"/></svg>
        </span>
        <span class="brand-name">SmartRailControl</span>
        <span class="page-title" data-i18n="locos.title">Locomotives</span>
      </div>

      <div class="topbar-actions">
        <span id="saveState" class="save-state" aria-live="polite"></span>
        <button type="button" id="windowClose" class="icon-button window-close" aria-label="Close" title="Close" data-i18n-attr="aria-label:common.close; title:common.close">✕</button>
      </div>
    </header>

    <main class="decoders-main">
      <section class="card decoders-card" aria-labelledby="locosHeading">
        <div class="card-header">
          <h2 id="locosHeading" data-i18n="locos.heading">Locomotives</h2>
          <button type="button" id="addLoco" class="ghost small" data-i18n="locos.add">+ Add locomotive</button>
        </div>
        <p class="hint decoders-hint" data-i18n="locos.hint">
          Changes are saved right away. Max speed is the highest speed step (of 126) the throttle sends for this locomotive; the throttle shows the speed as a percentage of it.
        </p>

        <div class="decoders-list" role="table" aria-labelledby="locosHeading">
          <div class="loco-row decoder-head" role="row">
            <span role="columnheader" data-i18n="locos.name">Name</span>
            <span role="columnheader" data-i18n="locos.decoder">Decoder address</span>
            <span role="columnheader" data-i18n="locos.maxSpeed">Max speed</span>
            <span role="columnheader"><span class="visually-hidden" data-i18n="locos.remove">Remove</span></span>
          </div>
          <div id="locoRows" role="rowgroup"></div>
        </div>

        <p id="statusLine" class="response" aria-live="polite"></p>
      </section>
    </main>

    <script src="i18n.js"></script>
    <script src="locomotives.js"></script>
    <script src="window.js"></script>
  </body>
</html>
